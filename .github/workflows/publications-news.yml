name: Publications and news digest

on:
  workflow_dispatch:
  schedule:
    - cron: "13 11 */2 * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        run: python scripts/fetch_publications_news.py

      - name: Commit updated digests
        run: |
          if git diff --quiet -- reports state; then
            echo "No digest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          git commit -m "chore: update publications and news digest"
          git push
